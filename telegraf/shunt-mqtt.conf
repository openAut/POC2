# openAut POC2 — Telegraf input for shunt MQTT topics
# Append this consumer to the existing POC1 Telegraf config, or drop it into
# the telegraf.d/ directory if you split configs. Writes to openaut.shunt_readings
# via the same PostgreSQL/TimescaleDB output already configured in POC1.
#
# Topic:   openaut/<site>/shunt/<signal>
# Payload: {"value":X,"unit":"...","ts":"...","site":"...","group":"shunt"}

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics  = ["openaut/+/shunt/+"]
  data_format = "json_v2"
  # username = "$MQTT_USERNAME"
  # password = "$MQTT_PASSWORD"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic    = "openaut/+/shunt/+"
    measurement = "_/_/_/_"
    tags     = "_/site/_/signal_name"

  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "value"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "unit"
      type = "string"
      optional = true

# NOTE: signals like "mode" and "failsafe_reason" carry text, not numbers.
# If you want those persisted, add a text_value mapping or a second consumer
# that maps the JSON "value" to text_value for non-numeric signals.
